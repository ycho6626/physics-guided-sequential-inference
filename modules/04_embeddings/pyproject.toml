[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semgen-embeddings"
version = "0.1.0"
description = "Module 04 supervised embeddings for semgen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
semgen = "semgen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
