schema_version: "emb.v1"

embedding:
  dim: 2
  normalize: true

model:
  type: "mlp"
  hidden_dims: [32, 16]
  activation: "relu"
  batch_norm: false

loss:
  classification:
    enabled: true
    weight: 1.0
  metric:
    enabled: true
    type: "triplet"
    margin: 0.5
    weight: 1.0

training:
  epochs: 40
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping:
    enabled: true
    patience: 8
  seed: 123

data_split:
  method: "hash"
  train_frac: 0.8

output:
  include_passthrough: true
