schema_version: "ind.v1"

preprocessing:
  normalization: "unit_max"
  smoothing:
    enabled: true
    method: "savitzky_golay"
    window: 11
    poly_order: 3

clipping:
  enabled: true
  y_min: 0.0
  y_max: 1.0
  eps: 1.0e-9

baseline:
  enabled: true
  model: "poly2"
  robust_fit: false
  lambda_rescale: true
  eps: 1.0e-9

snr:
  mode: "residual"
  signal_stat: "median"
  noise_stat: "mad"
  snr_max: 1000000.0
  eps: 1.0e-9

band_ratios:
  stat: "mean"
  eps: 1.0e-9
  ratio_min: 0.0
  ratio_max: 1000000.0
  ratio_1:
    numerator: [1200.0, 1250.0]
    denominator: [1350.0, 1400.0]
  ratio_2:
    numerator: [1500.0, 1560.0]
    denominator: [1700.0, 1760.0]
  ratio_3:
    numerator: [1010.0, 1060.0]
    denominator: [1300.0, 1350.0]

entropy:
  enabled: true
  use_residual: true
  normalize: true
  eps: 1.0e-12
  bins:
    enabled: false
    n_bins: 64

output:
  include_audit_fields: true
  include_passthrough_labels: true
