schema_version: "sim.v1"
output:
  format: "parquet"
  include_clean: true
  include_latents: true
  compression: "zstd"
wavelength_grid:
  start_nm: 900.0
  stop_nm: 2500.0
  step_nm: 2.0
seed:
  base: 123
sampling:
  n_samples: 5000
  mode: "iid"
  n_sequences: 200
  sequence_length: 40
  dt_seconds: 1.0
agents:
  hazard_agents: ["GB", "VX"]
  benign_agents: ["NONE", "WATER", "OIL"]
  library:
    NONE:
      absorption_profile: "builtin:no_absorption"
    WATER:
      absorption_profile: "builtin:gaussian_peaks"
      peaks:
        - {center_nm: 1450, width_nm: 40, strength: 0.18}
        - {center_nm: 1940, width_nm: 60, strength: 0.14}
    OIL:
      absorption_profile: "builtin:gaussian_peaks"
      peaks:
        - {center_nm: 1200, width_nm: 30, strength: 0.12}
        - {center_nm: 1725, width_nm: 45, strength: 0.10}
    GB:
      absorption_profile: "builtin:gaussian_peaks"
      peaks:
        - {center_nm: 1210, width_nm: 20, strength: 1.0}
        - {center_nm: 1730, width_nm: 35, strength: 0.6}
    VX:
      absorption_profile: "builtin:gaussian_peaks"
      peaks:
        - {center_nm: 1040, width_nm: 25, strength: 0.9}
        - {center_nm: 1520, width_nm: 40, strength: 0.7}
mixtures:
  enabled: true
  max_components: 2
  weight_prior: "dirichlet"
  dirichlet_alpha: 0.8
latents:
  concentration:
    prior: "loguniform"
    min: 1.0e-6
    max: 1.0e-2
  path_length:
    prior: "uniform"
    min: 0.1
    max: 5.0
  humidity:
    prior: "uniform"
    min: 0.0
    max: 1.0
  distance_m:
    prior: "uniform"
    min: 0.5
    max: 20.0
  angle_deg:
    prior: "uniform"
    min: 0.0
    max: 60.0
illumination:
  model: "blackbody"
  blackbody:
    temp_K:
      prior: "uniform"
      min: 2500
      max: 6500
baseline:
  enabled: true
  model: "poly2"
  poly2:
    b0: {prior: "normal", mean: 0.0, std: 0.02}
    b1: {prior: "normal", mean: 0.0, std: 0.005}
    b2: {prior: "normal", mean: 0.0, std: 0.001}
sensor_response:
  enabled: true
  model: "smooth_random"
  smooth_random:
    knots: 8
    amplitude: 0.05
noise:
  gaussian:
    enabled: true
    sigma:
      prior: "uniform"
      min: 0.001
      max: 0.02
  shot:
    enabled: true
    alpha:
      prior: "uniform"
      min: 0.0
      max: 0.02
  clipping:
    enabled: true
    y_min: 0.0
    y_max: 1.0
scenarios:
  flicker:
    enabled: true
    prob: 0.15
    duration_steps: {min: 1, max: 5}
    baseline_spike_std: 0.06
labeling:
  mode: "binary"
  hazard_label: "hazard"
  benign_label: "benign"
